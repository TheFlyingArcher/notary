name: Bug report
description: Something in Notary isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not paste private keys, passwords, tokens or connection strings.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Certificate authorities
        - Certificates
        - Revocation / CRLs
        - Authentication
        - Web UI
        - Setup
        - Docker / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Notary version or commit, .NET version, OS / host (for example Raspberry Pi OS), and how it is deployed.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant log output or screenshots. Redact anything sensitive.
      render: text
