# Notary production stack for the Raspberry Pi.
#
# Copy this file and .env.example (renamed to .env) into PI_DEPLOY_PATH (e.g. /opt/notary).
# The Deploy workflow runs `docker compose pull && docker compose up -d` there with NOTARY_TAG exported, so the
# release it passes overrides any NOTARY_TAG in .env. There is no default: only published releases go to production.

services:
  notary-web:
    image: ${DOCKER_HUB_USER:?Set DOCKER_HUB_USER in .env}/notary-web:${NOTARY_TAG:?Set NOTARY_TAG in .env to a release version, e.g. 1.2.14}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
        # mongo only exists under the "local-db" profile; skip the wait when using an external MongoDB.
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Required. Passphrase protecting every stored private key (16+ characters).
      # Never change it on a deployment that already has keys. See docs/private-key-storage.md.
      NOTARY_APP_KEY: ${NOTARY_APP_KEY:?Set NOTARY_APP_KEY in .env}

      # Database (MongoDB 5.0 or later, Stable API v1). Host is a MongoDB URL; the user authenticates against "admin".
      # Default targets the bundled mongo service (local-db profile). Otherwise point it at your own server.
      NOTARY_DB_HOST: ${NOTARY_DB_HOST:-mongodb://mongo:27017}
      NOTARY_DB_NAME: ${NOTARY_DB_NAME:-notary}
      NOTARY_DB_USERNAME: ${NOTARY_DB_USERNAME:?Set NOTARY_DB_USERNAME in .env}
      NOTARY_DB_PASSWORD: ${NOTARY_DB_PASSWORD:?Set NOTARY_DB_PASSWORD in .env}

      # Auth0 sign-in (OpenID Connect). All four are required to log in.
      NOTARY_OPENID_DOMAIN: ${NOTARY_OPENID_DOMAIN:?Set NOTARY_OPENID_DOMAIN in .env}
      NOTARY_OPENID_CLIENTID: ${NOTARY_OPENID_CLIENTID:?Set NOTARY_OPENID_CLIENTID in .env}
      NOTARY_OPENID_CLIENTSECRET: ${NOTARY_OPENID_CLIENTSECRET:?Set NOTARY_OPENID_CLIENTSECRET in .env}
      # Which Auth0 tenant these values belong to. Notary refuses to start if it does not suit ASPNETCORE_ENVIRONMENT.
      NOTARY_OPENID_TENANT: ${NOTARY_OPENID_TENANT:?Set NOTARY_OPENID_TENANT=production in .env}

      # Optional. Public base address used in the CRL distribution points of issued certificates,
      # e.g. https://pki.example.com. When blank, the address the request arrived at is used.
      NOTARY_CRL_ENDPOINT: ${NOTARY_CRL_ENDPOINT:-}
    volumes:
      # ASP.NET Data Protection keys (sign-in cookies, anti-forgery tokens). Without a volume they are lost when the
      # container is recreated on each deploy, which signs everyone out.
      - notary-dataprotection:/root/.aspnet/DataProtection-Keys
    ports:
      # Loopback only: the host NGINX (deploy/nginx/notary.conf) is the sole way in. See #50.
      - "127.0.0.1:8080:8080"
    networks:
      - notary

  mongo:
    # Optional bundled database: start with `docker compose --profile local-db up -d`.
    # NOT for a Raspberry Pi 4: MongoDB 5.0+ needs ARMv8.2-A (Pi 5 or x64). Pi 4 users: see docs/ci-cd.md and #59.
    profiles: ["local-db"]
    image: mongo:7
    restart: unless-stopped
    environment:
      # Creates the root user in the "admin" database on first start, which is where Notary authenticates.
      MONGO_INITDB_ROOT_USERNAME: ${NOTARY_DB_USERNAME:?Set NOTARY_DB_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTARY_DB_PASSWORD:?Set NOTARY_DB_PASSWORD in .env}
    volumes:
      - notary-db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - notary
    # No ports published: only notary-web on the internal network can reach the database.

volumes:
  notary-dataprotection:
  notary-db:

networks:
  notary:
