# NGINX site for Notary on the Raspberry Pi's host NGINX (shared with other projects).
# Install: sudo cp notary.conf /etc/nginx/sites-available/notary
#          sudo ln -s /etc/nginx/sites-available/notary /etc/nginx/sites-enabled/notary
#          sudo nginx -t && sudo systemctl reload nginx
# Certificate files: /etc/nginx/certs/notary/fullchain.pem (leaf + intermediates) and privkey.pem (chmod 600).
# Proxies to the notary-web container, which is published on 127.0.0.1:8080 only (deploy/docker-compose.yml).

# Blazor Server holds a long-lived websocket (SignalR); only upgrade the connection when the client asks to.
# Named for Notary so it cannot clash with maps defined by other sites.
map $http_upgrade $notary_connection_upgrade
{
    default upgrade;
    ''      close;
}

server
{
    listen 80;
    listen [::]:80;
    server_name notary.unionsquared.lan;

    # CRLs are fetched over plain HTTP on purpose: checking a certificate's revocation over HTTPS would need
    # the very certificate being checked. Set NOTARY_CRL_ENDPOINT=http://notary.unionsquared.lan so issued
    # certificates point here. Only read access to the CRL path is proxied.
    location /api/crl/
    {
        limit_except GET HEAD
        {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else on plain HTTP redirects to HTTPS.
    location /
    {
        return 301 https://$host$request_uri;
    }
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notary.unionsquared.lan;

    ssl_certificate     /etc/nginx/certs/notary/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/notary/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:NOTARY_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No HSTS on purpose: a private CA certificate that expires or is replaced would lock browsers out.
    client_max_body_size 10m;

    location /
    {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Set, not appended: NGINX is the edge, so a client-supplied X-Forwarded-For must not be trusted.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $notary_connection_upgrade;

        # The OpenID sign-in callback sets several large cookies (id token, correlation, nonce). The default 4k/8k
        # header buffer rejects that response as "upstream sent too big header" and the browser sees a 502.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        proxy_buffering    off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
